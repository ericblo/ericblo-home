<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Move the Sun</title>
<style>
  :root { --ink: #fff3ee; --bg: #12040a; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  body { font-family: ui-sans-serif, -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif; color: var(--ink); touch-action: none; cursor: none; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  .hint {
    position: fixed; left: 50%; bottom: max(28px, env(safe-area-inset-bottom));
    transform: translateX(-50%); font-size: 12px; letter-spacing: .28em; text-transform: uppercase;
    opacity: .85; transition: opacity 1.6s ease; pointer-events: none; white-space: nowrap;
    mix-blend-mode: difference;
  }
  .hint.gone { opacity: 0; }
  .tag {
    position: fixed; left: 16px; top: max(16px, env(safe-area-inset-top));
    font-size: 11px; letter-spacing: .3em; text-transform: uppercase; opacity: .7;
    mix-blend-mode: difference; pointer-events: none;
  }
  .mode {
    position: fixed; right: 16px; top: max(16px, env(safe-area-inset-top));
    font-size: 11px; letter-spacing: .3em; text-transform: uppercase; opacity: .7;
    mix-blend-mode: difference; pointer-events: none; transition: opacity .4s;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="tag">Pajtim</div>
<div class="mode" id="mode">Sun</div>
<div class="hint" id="hint">Move to light the mountains · click to change the light</div>
<script>
(() => {
  const ART = "/pajtim/art.jpg";
  const canvas = document.getElementById('c');
  const gl = canvas.getContext('webgl', { antialias: false, premultipliedAlpha: false });
  const hint = document.getElementById('hint');
  const modeEl = document.getElementById('mode');
  if (!gl) { document.body.innerHTML = '<img src="' + ART + '" style="width:100vw;height:100vh;object-fit:cover">'; return; }

  const vs = `attribute vec2 p; varying vec2 v; void main(){ v = p*0.5+0.5; gl_Position = vec4(p,0.,1.); }`;
  const fs = `
  precision highp float;
  varying vec2 v;
  uniform sampler2D tex;
  uniform vec2 res, imgRes, light;
  uniform float t, height, intro;
  uniform vec3 lightCol;
  uniform float ambient;

  vec2 coverUV(vec2 s){
    float sa = res.x/res.y, ia = imgRes.x/imgRes.y;
    vec2 uv = s;
    if (sa > ia) { float k = ia/sa; uv.y = (s.y-0.5)*k + 0.5 + min(0.12, (1.0-k)*0.5); } else { uv.x = (s.x-0.5)*(sa/ia)+0.5; }
    return vec2(uv.x, 1.0-uv.y);
  }
  float lum(vec3 c){ return dot(c, vec3(0.30,0.45,0.25)); }
  float H(vec2 uv){
    vec2 px = 1.0/imgRes;
    float h = lum(texture2D(tex, uv).rgb)*0.52;
    h += lum(texture2D(tex, uv+vec2(px.x,0.)).rgb)*0.12;
    h += lum(texture2D(tex, uv-vec2(px.x,0.)).rgb)*0.12;
    h += lum(texture2D(tex, uv+vec2(0.,px.y)).rgb)*0.12;
    h += lum(texture2D(tex, uv-vec2(0.,px.y)).rgb)*0.12;
    return h;
  }
  float hash(vec2 p){ return fract(sin(dot(p, vec2(12.9898,78.233)))*43758.5453); }

  void main(){
    vec2 uv = coverUV(v);
    vec2 px = 1.6/imgRes;
    float hL = H(uv - vec2(px.x,0.)), hR = H(uv + vec2(px.x,0.));
    float hD = H(uv + vec2(0.,px.y)), hU = H(uv - vec2(0.,px.y));
    vec3 n = normalize(vec3((hL-hR)*height, (hD-hU)*height, 1.0));

    float aspect = res.x/res.y;
    vec3 P = vec3(v.x*aspect, v.y, H(uv)*0.04);
    vec3 Lp = vec3(light.x*aspect, light.y, 0.22);
    vec3 Ld = Lp - P;
    float dist = length(Ld);
    vec3 L = normalize(Ld);

    // soft shadow: march toward the light across the heightfield
    float sh = 1.0;
    vec2 dirS = (light - v); dirS.x *= 1.0; float len = length(dirS);
    if (len > 0.001) {
      vec2 stepS = dirS/len * 0.006;
      float h0 = H(uv);
      for (int i = 1; i <= 14; i++) {
        vec2 sp = v + stepS*float(i);
        float hs = H(coverUV(sp));
        float rise = float(i)*0.006 * (0.22/max(len,0.05)) * 0.9;
        sh = min(sh, clamp(1.0 - (hs - h0 - rise)*9.0, 0.0, 1.0));
      }
    }
    sh = mix(0.55, 1.0, sh);

    vec3 c0 = texture2D(tex, uv).rgb;
    vec2 q1 = 1.0/imgRes;
    vec3 bl = (texture2D(tex, uv+vec2(q1.x,0.)).rgb + texture2D(tex, uv-vec2(q1.x,0.)).rgb
             + texture2D(tex, uv+vec2(0.,q1.y)).rgb + texture2D(tex, uv-vec2(0.,q1.y)).rgb
             + texture2D(tex, uv+q1).rgb + texture2D(tex, uv-q1).rgb
             + texture2D(tex, uv+vec2(q1.x,-q1.y)).rgb + texture2D(tex, uv+vec2(-q1.x,q1.y)).rgb) / 8.0;
    vec3 albedo = clamp(c0 + (c0 - bl)*0.7, 0.0, 1.0);
    float diff = max(dot(n, L), 0.0);
    vec3 V = vec3(0.,0.,1.);
    float spec = pow(max(dot(reflect(-L, n), V), 0.0), 44.0);
    float fall = 1.0 / (1.0 + dist*dist*2.2);

    vec3 col = albedo * ambient;
    col += albedo * lightCol * (diff*diff) * fall * 1.6 * sh;
    col += mix(lightCol, albedo*1.6, 0.5) * spec * fall * 0.45 * sh;
    // halo around the sun itself
    float glow = exp(-dist*dist*60.0);
    col += albedo * lightCol * glow * 0.25;

    col = col / (1.0 + col*0.18);            // gentle tonemap
    col = pow(col, vec3(0.95));
    col += (hash(v*res + t) - 0.5) * 0.018;  // film grain
    vec2 q = v - 0.5; col *= 1.0 - dot(q,q)*0.25;
    gl_FragColor = vec4(col * intro, 1.0);
  }`;

  function sh(type, src){ const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw gl.getShaderInfoLog(s); return s; }
  const prog = gl.createProgram();
  gl.attachShader(prog, sh(gl.VERTEX_SHADER, vs));
  gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(prog); gl.useProgram(prog);
  const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, 'p'); gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  const U = n => gl.getUniformLocation(prog, n);
  const u = { res: U('res'), imgRes: U('imgRes'), light: U('light'), t: U('t'), height: U('height'),
              intro: U('intro'), lightCol: U('lightCol'), ambient: U('ambient') };

  const modes = [
    { name: 'Sun',      col: [1.0, 0.93, 0.82], amb: 0.84, h: 16 },
    { name: 'Ember',    col: [1.0, 0.55, 0.30], amb: 0.58, h: 19 },
    { name: 'Ultraviolet', col: [0.55, 0.45, 1.0], amb: 0.44, h: 21 },
    { name: 'Moon',     col: [0.70, 0.85, 1.0], amb: 0.16, h: 24 },
  ];
  let mi = 0, cur = { ...modes[0], col: [...modes[0].col] };

  const img = new Image();
  img.onload = () => {
    const tex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, img);
    gl.uniform2f(u.imgRes, img.width, img.height);
    requestAnimationFrame(frame);
  };
  img.src = ART;

  function resize(){
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(innerWidth * dpr); canvas.height = Math.round(innerHeight * dpr);
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.uniform2f(u.res, canvas.width, canvas.height);
  }
  addEventListener('resize', resize); resize();

  // light position in screen space (0..1, y up)
  const target = { x: 0.5, y: 0.82 }, pos = { x: 0.5, y: 0.82 };
  let lastInput = -1e9, hidden = false;
  function setFromClient(x, y){
    target.x = x / innerWidth; target.y = 1 - y / innerHeight;
    lastInput = performance.now();
    if (!hidden) { hidden = true; setTimeout(() => hint.classList.add('gone'), 2200); }
  }
  addEventListener('pointermove', e => setFromClient(e.clientX, e.clientY));
  addEventListener('pointerdown', e => {
    setFromClient(e.clientX, e.clientY);
    askTilt();
  });
  addEventListener('click', () => {
    mi = (mi + 1) % modes.length;
    modeEl.textContent = modes[mi].name;
  });
  addEventListener('keydown', e => { if (e.key === ' ') { mi = (mi + 1) % modes.length; modeEl.textContent = modes[mi].name; } });

  // phone tilt moves the sun
  let tiltAsked = false;
  function askTilt(){
    if (tiltAsked) return; tiltAsked = true;
    const D = window.DeviceOrientationEvent;
    if (D && typeof D.requestPermission === 'function') D.requestPermission().then(r => r === 'granted' && listenTilt()).catch(()=>{});
    else if (D) listenTilt();
  }
  function listenTilt(){
    addEventListener('deviceorientation', e => {
      if (e.gamma == null) return;
      target.x = Math.min(1, Math.max(0, 0.5 + e.gamma / 60));
      target.y = Math.min(1, Math.max(0, 0.5 + (60 - e.beta) / 70));
      lastInput = performance.now();
    });
  }

  const start = performance.now();
  function frame(now){
    const t = (now - start) / 1000;
    // drift on its own when idle, like a slow day passing
    if (now - lastInput > 3500) {
      target.x = 0.5 + Math.sin(t * 0.17) * 0.42;
      target.y = 0.55 + Math.sin(t * 0.11 + 1.3) * 0.38;
    }
    pos.x += (target.x - pos.x) * 0.08; pos.y += (target.y - pos.y) * 0.08;
    const m = modes[mi];
    for (let i = 0; i < 3; i++) cur.col[i] += (m.col[i] - cur.col[i]) * 0.05;
    cur.amb += (m.amb - cur.amb) * 0.05; cur.h += (m.h - cur.h) * 0.05;

    gl.uniform2f(u.light, pos.x, pos.y);
    gl.uniform1f(u.t, t);
    gl.uniform1f(u.height, cur.h);
    gl.uniform3fv(u.lightCol, cur.col);
    gl.uniform1f(u.ambient, cur.amb);
    gl.uniform1f(u.intro, Math.min(1, t / 2.2));
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
